name: release

# Build and publish binaries for Windows, macOS and Linux whenever a version tag
# (vX.Y.Z) is pushed. The project is pure Go (CGO_ENABLED=0, modernc.org/sqlite),
# so every target cross-compiles cleanly from a single Linux runner.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # needed to create the GitHub Release and upload assets

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 } # Intel Macs
          - { goos: darwin, goarch: arm64 } # Apple Silicon
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod # stay in sync with the module's Go version
          cache: true

      - name: Build & package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          bin="dealers-tui"
          [ "$GOOS" = "windows" ] && bin="dealers-tui.exe"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "dist/${bin}" ./cmd/dealers-tui
          cp README.md dist/ 2>/dev/null || true
          cp configs/config.example.json dist/ 2>/dev/null || true
          name="dealers-tui_${version}_${GOOS}_${GOARCH}"
          ( cd dist
            if [ "$GOOS" = "windows" ]; then
              zip -r "../${name}.zip" .
            else
              tar -czf "../${name}.tar.gz" .
            fi )

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            *.zip
            *.tar.gz
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true # flatten all archives into one folder

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
